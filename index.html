<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a4d8c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Breath">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Breath Hold</title>
<style>
  :root {
    --surface: #0a4d8c;
    --deep: #031a33;
    --track: rgba(255, 255, 255, .14);
    --accent: #5fd4f4;
    --breathe: #7ef0c9;
    --text: #f2f9ff;
    --muted: #9cc3e0;
    --panel: #06294d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    background: linear-gradient(180deg, var(--surface) 0%, #06315c 45%, var(--deep) 100%) fixed;
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    overflow: hidden; overscroll-behavior: none;
    user-select: none; -webkit-user-select: none;
  }
  body {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: clamp(16px, 4vh, 40px);
    padding: max(20px, env(safe-area-inset-top)) 24px max(20px, env(safe-area-inset-bottom));
  }
  .waves { position: fixed; left: 0; right: 0; bottom: 0; height: 13vh; pointer-events: none; z-index: 0; overflow: hidden; }
  .waves svg { position: absolute; bottom: 0; left: 0; width: 200%; height: 100%; }
  .waves .w1 { animation: drift 16s linear infinite; opacity: .22; }
  .waves .w2 { animation: drift 26s linear infinite reverse; opacity: .14; }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  body > *:not(.waves):not(.overlay) { position: relative; z-index: 1; }

  .top { text-align: center; min-height: 3.2em; }
  .phase { font-size: clamp(20px, 6vw, 30px); font-weight: 700; letter-spacing: .01em; }
  .round { margin-top: 4px; font-size: clamp(13px, 3.6vw, 17px); color: var(--muted); letter-spacing: .12em; text-transform: uppercase; }

  .dial { position: relative; width: min(74vw, 46vh); aspect-ratio: 1; }
  body.idle { gap: clamp(10px, 2vh, 22px); }
  .idle .top { min-height: 0; }
  .idle .dial { width: min(56vw, 30vh); }
  .idle .count { font-size: clamp(44px, 15vw, 110px); }
  .dial svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .track { fill: none; stroke: var(--track); stroke-width: 6; }
  .progress { fill: none; stroke: var(--accent); stroke-width: 6; stroke-linecap: round; transition: stroke .4s ease; }
  .readout { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .count { font-size: clamp(56px, 21vw, 160px); font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; transition: color .4s ease; }
  .label { margin-top: 10px; font-size: clamp(13px, 3.6vw, 18px); color: var(--muted); letter-spacing: .12em; text-transform: uppercase; text-align: center; }
  .breathe .count { color: var(--breathe); }
  .breathe .progress { stroke: var(--breathe); }

  button { appearance: none; border: 0; cursor: pointer; font-family: inherit; }
  .main {
    background: var(--accent); color: #032238;
    font-size: clamp(18px, 5vw, 24px); font-weight: 700;
    padding: 18px 0; width: min(78vw, 60vh);
    border-radius: 999px; letter-spacing: .02em;
    transition: background .4s ease, transform .05s ease;
  }
  .main:active { transform: scale(.98); }
  .main.breathe { background: var(--breathe); }
  .main[hidden], .link[hidden] { display: none; }
  .links { display: flex; gap: 28px; min-height: 24px; }
  .link { background: none; color: var(--muted); font-size: clamp(13px, 3.6vw, 16px); padding: 4px 2px; text-decoration: underline; text-underline-offset: 4px; }

  .settings { width: min(78vw, 60vh); display: grid; gap: 8px; }
  .settings[hidden] { display: none; }
  .row { display: flex; align-items: center; justify-content: space-between; font-size: clamp(14px, 3.8vw, 17px); color: var(--muted); }
  .stepper { display: flex; align-items: center; gap: 10px; color: var(--text); font-variant-numeric: tabular-nums; }
  .stepper span { min-width: 4.2em; text-align: center; font-weight: 600; }
  .stepper button { width: 34px; height: 34px; border-radius: 50%; background: var(--track); color: var(--text); font-size: 20px; line-height: 1; }
  .safety { width: min(78vw, 60vh); text-align: center; font-size: clamp(12px, 3.2vw, 14px); color: var(--muted); line-height: 1.45; }
  .safety[hidden] { display: none; }
  .result { width: min(78vw, 60vh); text-align: center; font-size: clamp(14px, 3.8vw, 17px); color: var(--text); font-variant-numeric: tabular-nums; line-height: 1.6; }
  .result:empty { display: none; }

  .overlay { position: fixed; inset: 0; z-index: 5; background: var(--panel); display: flex; flex-direction: column; padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom)); user-select: text; -webkit-user-select: text; }
  .overlay[hidden] { display: none; }
  .overlay h2 { margin: 0 0 12px; font-size: 22px; }
  .list { flex: 1; overflow-y: auto; font-variant-numeric: tabular-nums; }
  .session { padding: 12px 0; border-bottom: 1px solid var(--track); }
  .session b { display: block; margin-bottom: 4px; }
  .session div { color: var(--muted); font-size: 15px; line-height: 1.5; }
  .empty { color: var(--muted); }
  .bar { display: flex; gap: 12px; padding-top: 14px; }
  .bar button { flex: 1; padding: 14px 0; border-radius: 999px; font-size: 16px; font-weight: 700; background: var(--track); color: var(--text); }
  .bar button.primary { background: var(--accent); color: #032238; }
  textarea { width: 100%; height: 30vh; margin-top: 12px; background: var(--deep); color: var(--text); border: 1px solid var(--track); border-radius: 10px; padding: 10px; font: 13px/1.4 ui-monospace, Consolas, monospace; }
  textarea[hidden] { display: none; }
</style>
</head>
<body>
  <div class="waves" aria-hidden="true">
    <svg class="w1" viewBox="0 0 1200 100" preserveAspectRatio="none"><path fill="#bfe9ff" d="M0 50 Q75 20 150 50 T300 50 T450 50 T600 50 T750 50 T900 50 T1050 50 T1200 50 V100 H0Z"/></svg>
    <svg class="w2" viewBox="0 0 1200 100" preserveAspectRatio="none"><path fill="#bfe9ff" d="M0 60 Q100 35 200 60 T400 60 T600 60 T800 60 T1000 60 T1200 60 V100 H0Z"/></svg>
  </div>

  <div class="top">
    <div class="phase" id="phase">Breath hold</div>
    <div class="round" id="round"></div>
  </div>

  <div class="dial" id="dial">
    <svg viewBox="0 0 100 100">
      <circle class="track" cx="50" cy="50" r="45"></circle>
      <circle class="progress" id="ring" cx="50" cy="50" r="45"></circle>
    </svg>
    <div class="readout">
      <div class="count" id="count">0:00</div>
      <div class="label" id="label">ready</div>
    </div>
  </div>

  <div class="result" id="result"></div>

  <div class="settings" id="settings">
    <div class="row"><span>Calm breathing first</span><div class="stepper"><button data-k="prep" data-d="-1">&minus;</button><span id="v-prep"></span><button data-k="prep" data-d="1">+</button></div></div>
    <div class="row"><span>Hold time</span><div class="stepper"><button data-k="target" data-d="-1">&minus;</button><span id="v-target"></span><button data-k="target" data-d="1">+</button></div></div>
    <div class="row"><span>Rest between holds</span><div class="stepper"><button data-k="rest" data-d="-1">&minus;</button><span id="v-rest"></span><button data-k="rest" data-d="1">+</button></div></div>
    <div class="row"><span>Holds</span><div class="stepper"><button data-k="rounds" data-d="-1">&minus;</button><span id="v-rounds"></span><button data-k="rounds" data-d="1">+</button></div></div>
  </div>

  <button class="main" id="btn">Start</button>
  <div class="links">
    <button class="link" id="end" hidden>End session</button>
    <button class="link" id="openHistory">History</button>
  </div>
  <div class="safety" id="safety">Dry land only, lying down. No fast deep breaths beforehand. Breathe right away at panic, dizziness, vision changes or chest pain.</div>

  <div class="overlay" id="history" hidden>
    <h2>History</h2>
    <div class="list" id="list"></div>
    <textarea id="csv" readonly hidden></textarea>
    <div class="bar">
      <button id="closeHistory">Close</button>
      <button class="primary" id="export">Export CSV</button>
    </div>
  </div>

<script>
(() => {
  "use strict";
  const R = 45, C = 2 * Math.PI * R;
  const STORE = "breathHold.sessions.v1";
  const PREFS = "breathHold.prefs.v1";

  // step, min, max per setting; prep/rest/target in seconds
  const LIMITS = {
    prep:   { step: 60, min: 60,  max: 300 },
    target: { step: 5,  min: 10,  max: 120 },
    rest:   { step: 30, min: 60,  max: 300 },
    rounds: { step: 1,  min: 1,   max: 6 }
  };
  const DEFAULTS = { prep: 180, target: 20, rest: 120, rounds: 4 };

  const $ = (id) => document.getElementById(id);
  const elDial = $("dial"), elRing = $("ring"), elCount = $("count"), elLabel = $("label");
  const elPhase = $("phase"), elRound = $("round"), elResult = $("result");
  const elSettings = $("settings"), elSafety = $("safety");
  const btn = $("btn"), btnEnd = $("end"), btnOpenHistory = $("openHistory");

  elRing.style.strokeDasharray = C;

  let prefs = Object.assign({}, DEFAULTS, readJson(PREFS, {}));
  let state = "idle";   // idle | prep | ready | hold | rest
  let phaseStart = 0;   // performance.now() at start of the current phase
  let round = 0;
  let rounds = [];      // finished holds this session: {target, held, completed}
  let breatheUntil = 0; // performance.now() until which "Breathe now" stays on screen
  let timerId = null, audioCtx = null, wakeLock = null;

  function readJson(key, fallback) {
    try { const v = JSON.parse(localStorage.getItem(key)); return v == null ? fallback : v; }
    catch (e) { return fallback; }
  }
  function writeJson(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} }

  function fmt(sec) {
    const s = Math.max(0, Math.floor(sec));
    return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  }
  function fmtCeil(sec) { return fmt(Math.ceil(Math.max(0, sec))); }
  function drawRing(frac) { elRing.style.strokeDashoffset = C * (1 - Math.max(0, Math.min(1, frac))); }
  function elapsed() { return (performance.now() - phaseStart) / 1000; }

  function renderPrefs() {
    $("v-prep").textContent = fmt(prefs.prep);
    $("v-target").textContent = fmt(prefs.target);
    $("v-rest").textContent = fmt(prefs.rest);
    $("v-rounds").textContent = prefs.rounds;
  }

  function enter(next) {
    state = next;
    phaseStart = performance.now();
    const active = next !== "idle";
    document.body.classList.toggle("idle", !active);
    elSettings.hidden = active;
    elSafety.hidden = active;
    btnOpenHistory.hidden = active;
    btnEnd.hidden = !active;
    btn.hidden = next === "rest";
    btn.classList.remove("breathe");
    elDial.classList.remove("breathe");
    elRound.textContent = active ? "Hold " + round + " of " + prefs.rounds : "";

    if (next === "idle") {
      elPhase.textContent = "Breath hold";
      elCount.textContent = "0:00"; elLabel.textContent = "ready";
      btn.textContent = "Start"; drawRing(1);
    } else if (next === "prep") {
      elPhase.textContent = "Breathe calmly";
      elLabel.textContent = "normal breathing";
      btn.textContent = "Skip";
    } else if (next === "ready") {
      elPhase.textContent = "One deep breath in";
      elCount.textContent = "0:00"; elLabel.textContent = "then tap";
      btn.textContent = "Start hold"; drawRing(1);
    } else if (next === "hold") {
      elPhase.textContent = "Hold. Relax jaw, shoulders, belly";
      elLabel.textContent = "holding";
      elCount.textContent = fmt(prefs.target);
      btn.textContent = "Breathing early"; drawRing(1);
    } else if (next === "rest") {
      elPhase.textContent = "Rest. Breathe normally";
      elLabel.textContent = "until next hold";
    }
  }

  function tick() {
    const el = elapsed();
    if (state === "prep" || state === "rest") {
      const dur = state === "prep" ? prefs.prep : prefs.rest;
      const rem = dur - el;
      if (rem <= 0) {
        signal();
        if (state === "rest") round += 1;
        enter("ready");
      } else {
        drawRing(rem / dur);
        elCount.textContent = fmtCeil(rem);
      }
    } else if (state === "hold") {
      const rem = prefs.target - el;
      if (rem <= 0) {
        signal();
        endHold(true);
      } else {
        drawRing(rem / prefs.target);
        elCount.textContent = fmtCeil(rem);
      }
    }
    if (breatheUntil && performance.now() >= breatheUntil) clearBreathe();
  }

  // "Breathe now" stays up for a few seconds after the signal, over rest or the idle screen
  function showBreathe() {
    breatheUntil = performance.now() + 5000;
    elPhase.textContent = "Breathe now";
    elDial.classList.add("breathe");
    if (!timerId) setTimeout(clearBreathe, 5000);
  }
  function clearBreathe() {
    if (!breatheUntil) return;
    breatheUntil = 0;
    elDial.classList.remove("breathe");
    if (state === "rest") elPhase.textContent = "Rest. Breathe normally";
    else if (state === "idle") elPhase.textContent = "Breath hold";
  }

  function startSession() {
    initAudio();
    requestWakeLock();
    rounds = []; round = 1; breatheUntil = 0;
    elResult.textContent = "";
    enter("prep");
    // interval, not requestAnimationFrame: keeps firing the signals even if the page stops painting
    if (!timerId) timerId = setInterval(tick, 100);
  }

  function endHold(completed) {
    const held = completed ? prefs.target : Math.min(prefs.target, round1(elapsed()));
    rounds.push({ target: prefs.target, held: held, completed: completed });
    showRounds();
    if (round < prefs.rounds) enter("rest");
    else finish();
    if (completed) showBreathe();
  }
  function round1(x) { return Math.round(x * 10) / 10; }

  function finish() {
    if (timerId) clearInterval(timerId);
    timerId = null;
    releaseWakeLock();
    if (rounds.length) {
      const all = readJson(STORE, []);
      all.push({ date: new Date().toISOString(), target: prefs.target, rest: prefs.rest, rounds: rounds });
      writeJson(STORE, all);
    }
    enter("idle");
    showRounds();
  }

  function summaryText(s) {
    if (!s.rounds.length || s.rounds[0].held == null) return "";
    const early = s.rounds.filter((r) => !r.completed);
    let t = (s.rounds.length - early.length) + "/" + s.rounds.length + " completed";
    if (early.length) t += ", early at " + early.map((r) => fmt(r.held)).join(", ");
    return t;
  }
  function roundText(r, i) {
    if (r.held != null) return (i + 1) + ".  held " + fmt(r.held) + " of " + fmt(r.target) + (r.completed ? "" : "  ·  breathing early");
    // sessions from before the fixed-time protocol stored {urge, end}
    return (i + 1) + ".  first urge " + (r.urge == null ? "–" : fmt(r.urge)) + "  ·  breathing " + fmt(r.end);
  }
  function showRounds() {
    elResult.innerHTML = "";
    rounds.forEach((r, i) => {
      const d = document.createElement("div");
      d.textContent = roundText(r, i);
      elResult.appendChild(d);
    });
  }

  // --- signal: beep + vibration ---
  function signal() {
    beep();
    if (navigator.vibrate) navigator.vibrate([180, 90, 180, 90, 320]);
  }
  function initAudio() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
    } catch (e) { /* no audio available */ }
  }
  function beep() {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    [0, 0.22, 0.44].forEach((t, i) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = "sine";
      o.frequency.value = i === 2 ? 1175 : 880;
      g.gain.setValueAtTime(0.0001, now + t);
      g.gain.exponentialRampToValueAtTime(0.4, now + t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, now + t + 0.18);
      o.connect(g).connect(audioCtx.destination);
      o.start(now + t); o.stop(now + t + 0.2);
    });
  }

  // --- wake lock (keep screen on during the whole session) ---
  async function requestWakeLock() {
    try {
      if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen");
    } catch (e) { /* ignore */ }
  }
  function releaseWakeLock() {
    try { if (wakeLock) { wakeLock.release(); wakeLock = null; } } catch (e) {}
  }
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && state !== "idle") requestWakeLock();
  });

  // --- controls ---
  btn.addEventListener("click", () => {
    if (state === "idle") startSession();
    else if (state === "prep") enter("ready");
    else if (state === "ready") enter("hold");
    else if (state === "hold") endHold(false);
  });
  btnEnd.addEventListener("click", () => { if (state !== "idle") finish(); });

  elSettings.addEventListener("click", (e) => {
    const b = e.target.closest("button[data-k]");
    if (!b) return;
    const k = b.dataset.k, L = LIMITS[k];
    prefs[k] = Math.max(L.min, Math.min(L.max, prefs[k] + L.step * Number(b.dataset.d)));
    writeJson(PREFS, prefs);
    renderPrefs();
  });

  // --- history ---
  function renderHistory() {
    const list = $("list");
    const all = readJson(STORE, []).slice().reverse();
    list.innerHTML = "";
    $("csv").hidden = true;
    if (!all.length) {
      const p = document.createElement("p");
      p.className = "empty"; p.textContent = "No sessions yet.";
      list.appendChild(p);
      return;
    }
    all.forEach((s) => {
      const box = document.createElement("div");
      box.className = "session";
      const h = document.createElement("b");
      h.textContent = new Date(s.date).toLocaleString([], { dateStyle: "medium", timeStyle: "short" });
      box.appendChild(h);
      const sum = summaryText(s);
      if (sum) { const d = document.createElement("div"); d.textContent = sum; box.appendChild(d); }
      s.rounds.forEach((r, i) => {
        const d = document.createElement("div");
        d.textContent = roundText(r, i);
        box.appendChild(d);
      });
      list.appendChild(box);
    });
  }
  function toCsv() {
    // last three columns are only filled for sessions from before the fixed-time protocol
    const lines = ["date,hold,target_s,held_s,completed,rest_setting_s,first_urge_s,breathing_s,calm_setting_s"];
    readJson(STORE, []).forEach((s) => {
      s.rounds.forEach((r, i) => {
        if (r.held != null) lines.push([s.date, i + 1, r.target, r.held, r.completed, s.rest, "", "", ""].join(","));
        else lines.push([s.date, i + 1, "", "", "", s.rest, r.urge == null ? "" : r.urge, r.end, s.extra].join(","));
      });
    });
    return lines.join("\n");
  }
  btnOpenHistory.addEventListener("click", () => { renderHistory(); $("history").hidden = false; });
  $("closeHistory").addEventListener("click", () => { $("history").hidden = true; });
  $("export").addEventListener("click", async () => {
    const csv = toCsv();
    const box = $("csv");
    box.value = csv; box.hidden = false;
    try {
      if (navigator.share) await navigator.share({ title: "Breath hold log", text: csv });
      else if (navigator.clipboard) await navigator.clipboard.writeText(csv);
    } catch (e) { /* user cancelled or unsupported: the text box stays as fallback */ }
  });

  renderPrefs();
  enter("idle");

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
  }
})();
</script>
</body>
</html>
